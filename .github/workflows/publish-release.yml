name: Publish Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    if: ${{ startsWith(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          tag="v${version}"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$version"
          test -n "$apk"
          cat > RELEASE_NOTES.md <<'EOF'
          ## 主要更新

          - 同步上游 Hail v1.11.0。
          - 保留 Hail_lock 的应用 PIN 防护，解冻、启动等敏感操作需要验证。
          - Device Owner 模式继续强制单用户限制，阻止通过系统分身/第二空间绕过。
          - 新增“禁止安装和更新应用（全局）”开关；开启后通过 Android Device Policy 阻止普通应用安装与覆盖更新。
          - 补齐上游 v1.11 的 Island 启动等待、动态快捷方式和 Xposed 相关修复。

          ## 注意

          - “禁止安装和更新应用”仅在 Hail 是活动 Device Owner 时可用，并且是全局限制；开启后 Hail 自己的普通 APK/应用商店更新也会被阻止，需要先关闭开关。
          - Hail_lock 与官方 Hail 的签名不相同，不能直接覆盖官方版安装。
          - 当前仓库尚未配置长期稳定的 Release 签名密钥；不同 CI/发行构建之间可能无法直接覆盖安装。正式作为长期更新渠道前，应先配置固定签名密钥。
          EOF
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hail_lock ${tag}" \
            --notes-file RELEASE_NOTES.md
