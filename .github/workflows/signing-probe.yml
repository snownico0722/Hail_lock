name: Signing Probe

on:
  push:
    branches:
      - feature/usage-limits
    paths:
      - '.github/workflows/signing-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.KEYSTORE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check signing secrets
        shell: bash
        run: |
          missing=0
          for name in SIGNING_KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All historical signing secrets are present."

      - name: Decode keystore and verify certificate
        shell: bash
        run: |
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > keystore.jks
          test -s keystore.jks
          keytool -exportcert \
            -keystore keystore.jks \
            -alias "$SIGNING_KEY_ALIAS" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -rfc \
            | openssl x509 -noout -fingerprint -sha256
          echo "Historical keystore opened successfully."
